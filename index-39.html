<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مركز مسار - الاستقبال والحسابات</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>(function(){var DONE=false;function msg(t){if(DONE)return;var ap=document.getElementById('app');if(ap&&ap.style.display&&ap.style.display!=='none'){DONE=true;return}var l=document.getElementById('login');if(l&&l.style.display!=='none'&&/جاري التحميل/.test(l.textContent||'')&&!document.querySelector('#login input')){l.style.display='flex';l.innerHTML='<div class="lbox" style="line-height:1.8">⚠️ '+t+'<br><button onclick="location.reload()" style="margin-top:10px;padding:8px 16px">↻ إعادة المحاولة</button></div>'}}
window.addEventListener('error',function(e){msg('المتصفح ده مش قادر يشغّل البرنامج.<br>حدّث الموبايل (iOS 12 أو أحدث) أو افتح الرابط من Safari أو Chrome.<br><small dir="ltr">'+String(e.message||'').slice(0,120)+'</small>')});
var chk=setInterval(function(){var ap=document.getElementById('app'),l=document.getElementById('login');if((ap&&ap.style.display&&ap.style.display!=='none')||(l&&!/جاري التحميل/.test(l.textContent||''))){DONE=true;clearInterval(chk)}},1000);setTimeout(function(){msg('البرنامج بياخد وقت طويل.<br>اتأكد من النت، أو افتح الرابط من Safari أو Chrome بدل الواتساب.')},20000)})();</script>
<style>
:root{--bg:#f3f6fa;--card:#fff;--line:#e3e9f0;--txt:#1d2a3a;--mut:#6a7a8c;--navy:#25408f;--navy2:#e9eefb;--green:#2f8f5b;--green2:#e8f5ee;--red:#c0392b;--redbg:#fdecea;--ambbg:#fff6e5}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--txt);font-size:16px}
.layout{display:flex;min-height:calc(100vh / var(--z,1))}
.zm{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut)}.zm button{min-width:38px}
.side{width:235px;flex-shrink:0;background:#fff;border-left:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:calc(100vh / var(--z,1));overflow-y:auto;display:flex;flex-direction:column;gap:16px;z-index:5}
.logo{font-size:28px;font-weight:700;color:var(--navy);text-align:center;line-height:1.15}.logo img{display:block;width:96px;height:96px;margin:0 auto 6px;border-radius:50%}.logo .em{display:block;font-size:12px;color:var(--mut);font-weight:400;margin-top:4px;direction:ltr}
#pendBar{position:fixed;top:0;left:0;right:0;z-index:90;background:#fff3cd;color:#7a5410;border-bottom:1px solid #f1d39a;padding:8px 14px;font-size:14px;font-weight:600;text-align:center;display:none}.logo b{color:var(--green)}.logo small{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:4px}
#nav{display:flex;flex-direction:column;gap:4px}
#nav button{display:flex;gap:10px;align-items:center;text-align:right;background:none;border:0;padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer;color:var(--txt)}
#nav button:hover{background:#f4f7fb}
#nav button.on{background:var(--navy2);color:var(--navy);font-weight:700}
.who{margin-top:auto;font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.who .nm{color:var(--txt);font-weight:700;font-size:14px}
main{flex:1;padding:22px;width:100%;max-width:1400px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(30,50,80,.04)}
h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:16px 0 8px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #cfd8e3;border-radius:9px;font:inherit;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy2)}
textarea{min-height:60px;resize:vertical}
.btn{background:var(--navy);color:#fff;border:0;padding:9px 16px;border-radius:9px;cursor:pointer;font:inherit;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ok{background:var(--green)}.btn.wa{background:#1fa855}
.btn.sec{background:#fff;color:var(--navy);border:1px solid #b9c6e6}
.btn.red{background:var(--red)}.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{background:#f6f8fc;color:var(--mut);font-weight:600}
tr.click{cursor:pointer}tr.click:hover{background:#f3f6fd}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcfe}
.stat b{display:block;font-size:20px;margin-top:2px}.stat span{font-size:12px;color:var(--mut)}
.neg{color:var(--red)}.pos{color:var(--green)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--navy2);color:var(--navy);font-weight:600}
.hint{font-size:13px;color:var(--mut);margin:-4px 0 10px}
.warn{background:var(--ambbg);border:1px solid #f1d39a;color:#7a5410;padding:9px 12px;border-radius:9px;margin-bottom:14px;font-size:14px}
.secret{background:var(--redbg);border:1px solid #f3c2bc;color:#8a2a20;padding:7px 11px;border-radius:9px;font-size:13px;margin:8px 0}
tr.void td{text-decoration:line-through;color:#a9b3bc}
.summary{display:flex;gap:18px;flex-wrap:wrap;background:var(--green2);border-radius:10px;padding:11px 14px;margin-top:12px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(20,30,50,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 10px;overflow:auto;z-index:50}
#modal2{z-index:60}
.modal .box{background:#fff;border-radius:14px;max-width:800px;width:100%;padding:20px}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#eef2fb,#eaf6ef);padding:16px;overflow:auto}
.lbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;width:100%;max-width:400px;box-shadow:0 8px 30px rgba(30,50,90,.08);margin:auto}
.lbox.wide{max-width:620px}
.lbox input,.lbox select{margin-bottom:10px}
.steps{padding-right:20px;line-height:1.9;font-size:14px}
.medi{border-right:3px solid var(--navy);padding:7px 11px;margin-bottom:8px;background:#f7f9fd;border-radius:8px;white-space:pre-wrap}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:100;display:none;align-items:center;justify-content:center;font-weight:700;color:var(--navy)}
#busy div{background:#fff;border:1px solid var(--line);padding:14px 22px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
#toast{position:fixed;bottom:22px;left:22px;background:var(--green);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;z-index:110;display:none}
#printArea{display:none}
.rc{max-width:720px;margin:auto;color:#000;font-family:Cairo,Tahoma,sans-serif}
.rc table td,.rc table th{border:1px solid #999;padding:6px}
.rc .hd{text-align:center;border-bottom:2px solid #25408f;padding-bottom:8px;margin-bottom:10px}
@media print{body.printing>*:not(#printArea){display:none!important}body.printing #printArea{display:block}body{background:#fff}}
@media(max-width:860px){.logo img{width:40px;height:40px;display:inline-block;vertical-align:middle;margin:0 0 0 6px}.logo .em{display:none}.layout{flex-direction:column}.side{width:auto;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px 10px;border-left:0;border-bottom:1px solid var(--line);gap:8px}.logo{font-size:20px}.logo small{display:none}#nav{flex-direction:row;flex-wrap:wrap}#nav button{padding:7px 9px}.who{margin:0;border:0;padding:0;flex-direction:row;align-items:center}main{padding:12px}}

/* وضوح أعلى: كتابة سوداء غامقة */
@media screen{:root{--txt:#000;--mut:#1f2933}
body{font-weight:600}
label{color:#000;font-weight:700;font-size:14px}
input,select,textarea{color:#000;font-weight:700;border:1.5px solid #6b7a8c}
input::placeholder,textarea::placeholder{color:#4a5563;font-weight:600}
th{color:#000;font-weight:700}td{color:#000}
.hint{color:#1f2933;font-weight:600}
.stat span{color:#000;font-weight:700;font-size:13px}
#nav button{font-weight:700}
tr.void td{color:#7b8591}}
</style>
</head>
<body>
<div id="login"><div class="lbox">جاري التحميل...</div></div>
<div id="app" class="layout" style="display:none">
<aside class="side"><div class="logo" id="sideLogo"></div><nav id="nav"></nav><div class="who" id="who"></div></aside>
<main id="main"></main>
</div>
<div class="modal" id="modal1"><div class="box"></div></div>
<div class="modal" id="modal2"><div class="box"></div></div>
<div id="busy"><div>⏳ جاري الاتصال...</div></div>
<div id="toast"></div>
<div id="pendBar"></div>
<div id="printArea"></div>

async function commPaid(id){const c=DB.comm.find(x=>x.id===id);c.status='paid';c.paidAt=nowISO();mark('comm',c,'up');log('دفع كومبيشن',`ملف ${fileOf(c.patientId)} | ${c.referrer} | ${money(c.amount)}`);if(await commit(false,secTok('report')))render()}
async function commVoid(id){const c=DB.comm.find(x=>x.id===id),r=prompt('سبب إلغاء الكومبيشن:');if(!r)return;Object.assign(c,{void:true,voidReason:r,voidBy:ME.name,voidAt:nowISO()});mark('comm',c,'up');log('إلغاء كومبيشن',`ملف ${fileOf(c.patientId)} | ${c.referrer} | ${money(c.amount)} | ${r}`);if(await commit(false,secTok('report')))render()}

/* ===== الأمانات / المصروف الشخصي للمريض ===== */
function walletOf(pid){const L=DB.wallet.filter(w=>w.patientId===pid).sort((a,b)=>a.at.localeCompare(b.at));let run=0;const rows=L.map(w=>{if(!w.void)run=r2(run+(w.dir==='in'?w.amount:-w.amount));return{w,run}});const act=L.filter(w=>!w.void);return{rows,inT:r2(act.filter(w=>w.dir==='in').reduce((s,w)=>s+w.amount,0)),outT:r2(act.filter(w=>w.dir==='out').reduce((s,w)=>s+w.amount,0)),bal:run}}
function walletHTML(pid){const W=walletOf(pid);
 return`<div class="card" style="border-color:#bfe0d8"><div class="row" style="justify-content:space-between"><h2 style="margin:0">👛 الأمانات / المصروف الشخصي <span class="tag" style="background:#e8f5ee;color:#2f8f5b">منفصل عن حساب العلاج</span></h2><div class="row"><button class="btn ok" onclick="mWallet('${pid}','in')">+ إيداع من الأهل</button><button class="btn red" onclick="mWallet('${pid}','out')">− صرف للمريض</button>${W.rows.length?`<button class="btn sec" onclick="printWallet('${pid}')">🖨️ كشف المصروف</button><button class="btn wa" onclick="waWallet('${pid}')">💬 واتساب</button>`:''}</div></div>
 <div class="stats" style="margin-top:12px"><div class="stat"><span>إجمالي اللي الأهل سابوه</span><b class="pos">${money(W.inT)}</b></div><div class="stat"><span>إجمالي اللي اتصرف</span><b class="neg">${money(W.outT)}</b></div><div class="stat" style="background:${W.bal<0?'#fdecea':'#e8f5ee'}"><span>الرصيد المتبقي</span><b class="${W.bal<0?'neg':'pos'}">${money(W.bal)}</b></div></div>
 ${W.rows.length?`<div class="tw" style="margin-top:10px">${walletTable(W,true)}</div>`:'<p class="hint" style="margin-top:10px">لا توجد حركات.</p>'}</div>`}
function walletTable(W,actions){return`<table><tr><th>التاريخ</th><th>البيان</th><th>إيداع</th><th>صرف</th><th>الرصيد</th>${actions?'<th>بواسطة</th><th></th>':''}</tr>${W.rows.map(({w,run})=>`<tr class="${w.void?'void':''}"><td>${fdt(w.at)}</td><td>${esc(w.desc)}${w.note?`<div style="font-size:12px;color:#666">${esc(w.note)}</div>`:''}${w.void?`<div class="hint neg" style="margin:0">ملغي: ${esc(w.voidReason)}</div>`:''}</td><td class="pos">${w.dir==='in'?money(w.amount):'—'}</td><td class="neg">${w.dir==='out'?money(w.amount):'—'}</td><td><b>${money(run)}</b></td>${actions?`<td>${esc(w.by)}</td><td>${w.void?'':`<button class="btn red sm" onclick="voidWallet('${w.id}')">🔐 إلغاء</button>`}</td>`:''}</tr>`).join('')}</table>`}
function mWallet(pid,dir){const P=pat(pid),W=walletOf(pid),inn=dir==='in';modal(`<h2>${inn?'+ إيداع من الأهل':'− صرف للمريض'} — ${esc(P.name)}</h2><p class="hint">الرصيد الحالي: <b>${money(W.bal)}</b></p><div class="grid">
 <div><label>التاريخ</label><input type="datetime-local" id="wAt" value="${localInput()}"></div>
 <div><label>${inn?'مين اللي ساب الفلوس؟ *':'اتصرف على إيه؟ *'}</label><input id="wDesc" list="wDL" placeholder="${inn?'مثال: والدته':'مثال: سجاير / أكل / بيبسي'}"><datalist id="wDL">${(inn?['الوالد','الوالدة','الأخ','الأخت','الزوجة']:['سجاير','أكل','بيبسي ومشروبات','فاكهة','ملابس','أدوات شخصية','كارت شحن']).map(x=>`<option value="${x}">`).join('')}</datalist></div>
 <div><label>المبلغ (${esc(DB.settings.cur)}) *</label><input id="wAmt" type="number" min="0" step="0.01"></div>
 <div><label>ملاحظة</label><input id="wNote"></div></div>
 <div class="row" style="margin-top:14px"><button class="btn ${inn?'ok':'red'}" onclick="saveWallet('${pid}','${dir}')">✓ حفظ</button><button class="btn sec" onclick="closeModal()">إلغاء</button></div>`);setTimeout(()=>$('#wDesc').focus(),50)}
async function saveWallet(pid,dir){const P=pat(pid),desc=$('#wDesc').value.trim(),amt=r2($('#wAmt').value);if(!desc||amt<=0)return alert('اكتب البيان والمبلغ');const W=walletOf(pid);
 if(dir==='out'&&amt>W.bal+0.001&&!confirm(`المبلغ (${money(amt)}) أكبر من الرصيد (${money(W.bal)}). الرصيد هيبقى بالسالب. متابعة؟`))return;
 const w={id:uid(),kind:'wallet',dir,patientId:pid,at:$('#wAt').value?new Date($('#wAt').value).toISOString():nowISO(),createdAt:nowISO(),desc,amount:amt,note:$('#wNote').value.trim(),by:ME.name,void:false};
 DB.wallet.push(w);mark('charges',w,'new');log(dir==='in'?'إيداع أمانات مريض':'صرف من أمانات مريض',`ملف ${P.fileNo} ${P.name} | ${desc} | ${money(amt)} | الرصيد بعدها: ${money(r2(W.bal+(dir==='in'?amt:-amt)))}`);if(await commit()){closeModal();go('file',pid)}}
function voidWallet(id){const w=DB.wallet.find(x=>x.id===id),r=prompt('سبب الإلغاء:');if(!r)return;needApproval(async(appr,tok)=>{Object.assign(w,{void:true,voidReason:r,voidBy:ME.name,voidAt:nowISO()});mark('charges',w,'up');log('إلغاء حركة أمانات',`ملف ${fileOf(w.patientId)} | ${w.desc} | ${money(w.amount)} | ${r}`);if(await commit(false,tok))go('file',w.patientId)},'إلغاء حركة أمانات')}
function printWallet(pid){const P=pat(pid),W=walletOf(pid);doPrint(`<div class="rc">${rcHead('كشف المصروف الشخصي (الأمانات)')}<p><b>${esc(P.name)}</b> — ملف ${P.fileNo} — ${fdt(nowISO())}</p>${walletTable(W,false)}<br><table style="width:100%"><tr><th>إجمالي الإيداعات</th><th>إجمالي المصروف</th><th>الرصيد المتبقي</th></tr><tr><td>${money(W.inT)}</td><td>${money(W.outT)}</td><td><b>${money(W.bal)}</b></td></tr></table></div>`)}
function waWallet(pid){const P=pat(pid),W=walletOf(pid),S=DB.settings;const t=`*${S.center}*\nكشف المصروف الشخصي بتاريخ ${fdt(nowISO())}\n\nالمريض: ${P.name} (ملف ${P.fileNo})\n\n`+W.rows.filter(x=>!x.w.void).map(({w,run})=>`• ${fdt(w.at).slice(0,10)} — ${w.dir==='in'?'إيداع':'صرف'}: ${w.desc} — ${money(w.amount)} (الرصيد: ${money(run)})`).join('\n')+`\n\nإجمالي الإيداعات: ${money(W.inT)}\nإجمالي المصروف: ${money(W.outT)}\n*الرصيد المتبقي: ${money(W.bal)}*\n\nللاستفسار: ${S.phones}`;
 const opts=[[P.phone,'المريض'],[P.phone2,'هاتف آخر'],[P.emPhone,'قريب الطوارئ'+(P.emName?' — '+P.emName:'')]].filter(x=>x[0]);
 modal(`<h2>💬 كشف المصروف عبر واتساب</h2><label>إلى</label><select id="waTo" onchange="$('#waOther').style.display=this.value?'none':''">${opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}: ${esc(o[0])}</option>`).join('')}<option value="">رقم آخر...</option></select><input id="waOther" type="tel" placeholder="اكتب الرقم" style="margin-top:8px;display:${opts.length?'none':''}"><label style="margin-top:10px">نص الرسالة</label><textarea id="waTxt" style="min-height:260px">${esc(t)}</textarea><div class="row" style="margin-top:10px"><button class="btn wa" onclick="sendWA('${pid}','كشف المصروف الشخصي')">💬 فتح واتساب وإرسال</button><button class="btn sec" onclick="closeModal()">إلغاء</button></div>`)}

/* ===== المرضى ===== */
function myScope(P){return!P.deleted&&!(ME.role==='doctor'&&ME.docId&&P.followId!==ME.docId&&P.supId!==ME.docId)}
function search(q){q=norm(q);const L=DB.patients.filter(myScope);if(!q)return L.slice().reverse();return L.filter(P=>norm(P.name).includes(q)||P.fileNo.toLowerCase().includes(q)||(P.phone||'').includes(q)||(P.phone2||'').includes(q))}
function vPatients(){return`<div class="card"><h2>👥 المرضى</h2>${ME.role==='doctor'&&ME.docId?'<p class="hint">تظهر لك الحالات التي تعالجها أو تشرف عليها فقط.</p>':''}<input id="pq" value="${esc(PQ)}" placeholder="ابحث بالاسم أو رقم الملف أو الهاتف..." oninput="PQ=this.value;pList()"><div id="plist" class="tw" style="margin-top:10px">${pListHTML(PQ)}</div></div>`}
function pList(){$('#plist').innerHTML=pListHTML(PQ)}
function pListHTML(q){const r=search(q).slice(0,300);if(!r.length)return'<p class="hint">لا توجد نتائج</p>';
 return`<table><tr><th>رقم الملف</th><th>الاسم</th><th>الهاتف</th><th>الطبيب المعالج</th><th>الحالة</th>${can.fin()?'<th>المتبقي</th>':''}<th>تاريخ الوصول</th></tr>${r.map(P=>{const b=can.fin()?bal(P.id):null;return`<tr class="click" onclick="go('file','${P.id}')"><td>${P.fileNo}</td><td>${esc(P.name)}</td><td>${esc(P.phone)}</td><td>${esc(docName(P.followId))}</td><td>${P.dischargeAt?'<span class="tag" style="background:#eef2f6;color:#555">خرج</span>':'<span class="tag" style="background:#e8f5ee;color:#2f8f5b">مقيم</span>'}</td>${b?`<td class="${b.rem>0?'neg':''}">${money(b.rem)}</td>`:''}<td>${fdt(admitOf(P))}</td></tr>`}).join('')}</table>`}

/* ===== ملف المريض ===== */
function info(l,v){return`<div><label>${l}</label><div>${esc(v||'—')}</div></div>`}
function vFile(pid){const P=pat(pid);if(!P)return'<div class="card">الملف غير موجود</div>';if(!myScope(P))return'<div class="card">ليس لديك صلاحية لفتح هذا الملف.</div>';
 let h=`<div class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${esc(P.name)} <span class="tag">ملف ${P.fileNo}</span></h2><div class="hint" style="margin:4px 0 0">سُجّل ${fdt(P.createdAt)} — بواسطة ${esc(P.createdBy)}</div></div>
 <div class="row">${can.fin()?`<button class="btn ok" onclick="mVisit('${pid}')">+ إضافة بند / خدمة</button><button class="btn" onclick="mPay('${pid}')">+ دفعة</button><button class="btn sec" onclick="printStatement('${pid}')">🖨️ كشف الحساب</button><button class="btn wa" onclick="mWA('stmt','${pid}')">💬 واتساب</button><button class="btn sec" onclick="mEdit('${pid}')">${ME.role==='admin'?'':'🔐 '}تعديل البيانات</button><button class="btn red" onclick="delPatient('${pid}')">🔐 🗑️ حذف الحالة</button>`:''}</div></div>
 <div class="grid" style="margin-top:14px">${info('الهاتف',P.phone)}${info('هاتف آخر',P.phone2)}${info('النوع',P.gender)}${info('السن',P.age)}${info('العنوان',P.address)}${info('قريب للطوارئ',P.emName)}${info('هاتف الطوارئ',P.emPhone)}</div></div>`;
 if(can.fin()){const b=bal(pid);h+=`<div class="card"><h2>💰 الحساب</h2><div class="stats"><div class="stat"><span>إجمالي المطلوب</span><b>${money(b.fee)}</b></div><div class="stat"><span>الخصومات</span><b>${money(b.disc)}</b></div><div class="stat"><span>الصافي</span><b>${money(b.net)}</b></div><div class="stat"><span>المدفوع</span><b class="pos">${money(b.paid)}</b></div><div class="stat"><span>المتبقي</span><b class="${b.rem>0?'neg':'pos'}">${money(b.rem)}</b></div></div>
  <h3>كشف الحساب</h3><div class="tw">${stmtTable(pid,true)}</div></div>`}
 h+=stayHTML(P);if(can.fin())h+=walletHTML(pid);if(can.fin())h+=canComm()?commHTML(pid):`<div class="card" style="padding:12px 18px"><div class="row" style="justify-content:space-between"><span class="hint" style="margin:0">💼 الكومبيشن (سري)</span><button class="btn sec sm" onclick="openComm('${pid}')">🔐 عرض / إضافة كومبيشن</button></div></div>`;
 h+=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">🩺 الطبيب المسؤول</h2>${can.fin()?`<button class="btn sec sm" onclick="mDoc('${pid}')">${ME.role==='admin'?'':'🔐 '}تغيير الطبيب / المشرف</button>`:''}</div>
 <div class="grid" style="margin-top:10px">${info('الطبيب / الأخصائي المعالج',docName(P.followId))}${info('الطبيب المشرف',P.supId?docName(P.supId):'نفس المعالج / غير محدد')}</div>
 <h3>تاريخ التغييرات</h3><div class="tw"><table><tr><th>التاريخ</th><th>المعالج</th><th>المشرف</th><th>السبب</th><th>بواسطة</th></tr>${(P.docHist||[]).slice().reverse().map(x=>`<tr><td>${fdt(x.at)}</td><td>${esc(docName(x.followId))}</td><td>${x.supId?esc(docName(x.supId)):'—'}</td><td>${esc(x.reason)}</td><td>${esc(x.by)}</td></tr>`).join('')}</table></div></div>`;
 if(can.med()){const M=DB.med.filter(m=>m.patientId===pid).sort((a,b)=>b.at.localeCompare(a.at));h+=`<div class="card"><h2>🔒 الملاحظات الطبية</h2><div class="secret">سرّي — يظهر للأطباء والإدارة فقط، ولا يظهر للاستقبال ولا في الإيصالات أو التقارير أو واتساب أو سجل العمليات.</div>
 ${M.map(m=>`<div class="medi"><div class="hint" style="margin:0 0 4px">${fdt(m.at)} — ${esc(m.by)}</div>${esc(m.text)}</div>`).join('')||'<p class="hint">لا توجد ملاحظات.</p>'}
 <textarea id="medT" placeholder="إضافة ملاحظة طبية..."></textarea><button class="btn" style="margin-top:8px" onclick="addMed('${pid}')">إضافة الملاحظة</button></div>`}
 return h}
function stmtTable(pid,actions){const rows=stmtRows(pid);if(!rows.length)return'<p class="hint">لا توجد حركات.</p>';
 return`<table><tr><th>التاريخ</th><th>البيان</th><th>مطلوب</th><th>خصم</th><th>مدفوع</th><th>الرصيد</th><th>بواسطة</th>${actions?'<th></th>':''}</tr>${rows.map(r=>{const o=r.o;
 if(r.t==='c')return`<tr class="${o.void?'void':''}"><td>${fdt(o.at)}</td><td>${esc(itemName(o))}${o.discAmt?`<div class="hint" style="margin:2px 0 0">خصم ${o.discType==='pct'?o.discVal+'%':''}: ${esc(o.discReason)} — موافقة ${esc(o.discApprovedBy)}</div>`:''}${o.note?`<div class="hint" style="margin:2px 0 0">ملاحظة: ${esc(o.note)}</div>`:''}${o.void?`<div class="hint neg">ملغاة: ${esc(o.voidReason)}</div>`:''}</td><td>${money(o.fee)}</td><td>${o.discAmt?money(o.discAmt):'—'}</td><td>—</td><td>${money(r.run)}</td><td>${esc(o.by)}</td>${actions?`<td>${can.fin()&&!o.void?`<div class="row"><button class="btn sec sm" onclick="mEditCharge('${o.id}')">🔐 ✏️ تعديل</button><button class="btn red sm" onclick="voidCharge('${o.id}')">🔐 إلغاء</button></div>`:''}</td>`:''}</tr>`;
 return`<tr class="${o.void?'void':''}"><td>${fdt(o.at)}</td><td>دفعة — ${esc(o.method)} <span class="tag">${o.receiptNo}</span>${o.for?` <span class="tag" style="background:${o.for==='stay'?'#e8f5ee':'#fff4e0'}">${o.for==='stay'?'🛏️ إقامة':'🧪 تحاليل'}</span>`:''}${o.note?`<div class="hint" style="margin:2px 0 0">ملاحظة: ${esc(o.note)}</div>`:''}${o.txn?`<div class="hint" style="margin:2px 0 0">${esc(o.bank)} مرجع: ${esc(o.txn)}</div>`:''}${o.void?`<div class="hint neg">ملغاة: ${esc(o.voidReason)}</div>`:''}</td><td>—</td><td>—</td><td>${money(o.amount)}</td><td>${money(r.run)}</td><td>${esc(rcvOf(o))}</td>${actions?`<td><div class="row">${!o.void?`<button class="btn sec sm" onclick="printReceipt('${o.id}')">🖨️</button><button class="btn wa sm" onclick="mWA('pay','${o.id}')">💬</button>`:''}${can.fin()&&!o.void?`<button class="btn sec sm" title="الدفعة دي لـ إقامة / تحاليل" onclick="mPayFor('${o.id}')">🔁</button><button class="btn red sm" onclick="voidPay('${o.id}')">🔐 إلغاء</button>`:''}</div></td>`:''}</tr>`}).join('')}</table>`}
function mVisit(pid){PREV.v=bal(pid).rem;modal(`<h2>إضافة بند / خدمة — ${esc(pat(pid).name)}</h2><p class="hint">كل بند بيظهر لوحده في الفاتورة (مثلاً: استشارة، حقن، جلسة إضافية).</p>${visitHTML('v',false)}<div class="row" style="margin-top:14px"><button class="btn ok" onclick="saveVisit('${pid}')">✓ حفظ</button><button class="btn sec" onclick="closeModal()">إلغاء</button></div>`);calc('v')}
function saveVisit(pid){const P=pat(pid),ch=readCharge('v',pid);if(!ch)return;const pay=readPay('v',pid);if(pay===false)return;if(pay)pay.for=isStay(ch)?'stay':'other';if(!overpayOK(pay,r2(PREV.v+ch.net)))return;
 const fin=(appr,tok)=>withNo(async()=>{if(ch.discAmt>0)ch.discApprovedBy=appr;ch.followId=P.followId;commitCharge(ch,P);if(pay){busy(true);await commitPay(pay);busy(false)}if(await commit(false,tok)){closeModal();go('file',pid);if(pay)doneModal(pay.id)}});
 ch.discAmt>0?needApproval(fin,'الخصم'):fin('',null)}
function mPay(pid){PREV.q=bal(pid).rem;modal(`<h2>تسجيل دفعة — ${esc(pat(pid).name)}</h2>${payHTML('q',true,true)}<div style="margin-top:10px"><label>ملاحظة على الدفعة (تظهر في الإيصال)</label><input id="qpnote"></div><div class="summary" id="qsum"></div><div class="row" style="margin-top:14px"><button class="btn ok" onclick="savePay('${pid}')">✓ حفظ الدفعة</button><button class="btn sec" onclick="closeModal()">إلغاء</button></div>`);
 if(PREV.q>0)$('#qpa').value=PREV.q;if(!DB.charges.some(c=>c.patientId===pid&&!c.void&&isStay(c)))$('#qfor').value='other';calc('q')}
function savePay(pid){const pay=readPay('q',pid);if(pay===false)return;if(!pay)return alert('اكتب المبلغ المدفوع');if(!overpayOK(pay,PREV.q))return;
 withNo(async()=>{busy(true);await commitPay(pay);busy(false);if(await commit()){closeModal();go('file',pid);doneModal(pay.id)}})}
function mDoc(pid){const P=pat(pid);modal(`<h2>تغيير الطبيب المسؤول — ${esc(P.name)}</h2><div class="grid">${docHTML('d',P.followId,P.supId)}</div><div style="margin-top:10px"><label>سبب التغيير *</label><input id="dreason"></div><div class="row" style="margin-top:14px"><button class="btn" onclick="saveDoc('${pid}')">حفظ</button><button class="btn sec" onclick="closeModal()">إلغاء</button></div>`)}
function saveDoc(pid){const P=pat(pid),f=$('#dfd').value,s=$('#dsd').value,r=$('#dreason').value.trim();if(!r)return alert('اكتب سبب التغيير');if(f===P.followId&&s===P.supId)return closeModal();
 needApproval(async(appr,tok)=>{log('تغيير الطبيب المسؤول',`ملف ${P.fileNo} ${P.name} | المعالج: ${docName(P.followId)} ← ${docName(f)} | المشرف: ${P.supId?docName(P.supId):'—'} ← ${s?docName(s):'—'} | السبب: ${r}`);
 P.followId=f;P.supId=s;P.docHist=P.docHist||[];P.docHist.push({at:nowISO(),by:ME.name,followId:f,supId:s,reason:r});mark('patients',P,'up');if(await commit(false,tok)){closeModal();go('file',pid)}},'تغيير الطبيب')}
function mEdit(pid){modal(`<h2>تعديل بيانات المريض</h2>${patHTML(pat(pid))}<div class="row" style="margin-top:14px"><button class="btn" onclick="saveEdit('${pid}')">حفظ</button><button class="btn sec" onclick="closeModal()">إلغاء</button></div>`)}
function saveEdit(pid){const P=pat(pid),d=readPat();if(!d.name||!d.phone)return alert('الاسم والهاتف مطلوبان');const ch=Object.keys(d).filter(k=>String(P[k]??'')!==String(d[k]??''));if(!ch.length)return closeModal();
 needApproval(async(appr,tok)=>{log('تعديل بيانات مريض',`ملف ${P.fileNo} | `+ch.map(k=>`${PLBL[k]}: "${P[k]??''}" ← "${d[k]}"`).join(' | '));Object.assign(P,d);mark('patients',P,'up');if(await commit(false,tok)){closeModal();go('file',pid)}},'تعديل بيانات المريض')}
async function addMed(pid){const t=$('#medT').value.trim();if(!t)return;const P=pat(pid),m={id:uid(),patientId:pid,at:nowISO(),by:ME.name,text:t};DB.med.push(m);mark('med',m,'new');log('إضافة ملاحظة طبية',`ملف ${P.fileNo} (المحتوى سرّي)`);if(await commit())go('file',pid)}
function mPayFor(id){const p=DB.payments.find(x=>x.id===id);modal(`<h2>🔁 الدفعة ${p.receiptNo} (${money(p.amount)}) لـ إيه؟</h2><div class="row" style="margin-top:10px"><button class="btn ok" onclick="savePayFor('${id}','stay')">🛏️ الإقامة</button><button class="btn" onclick="savePayFor('${id}','other')">🧪 التحاليل والبنود</button><button class="btn sec" onclick="closeModal()">إلغاء</button></div><p class="hint">مش بيغيّر المبلغ ولا الإيصال — بس بيحدد الفلوس دي اتحسبت على إيه.</p>`)}
function savePayFor(id,v){const p=DB.payments.find(x=>x.id===id);if(p.for===v)return closeModal();needApproval(async(appr,tok)=>{p.for=v;mark('payments',p,'up');log('تحديد نوع الدفعة',`إيصال ${p.receiptNo} | ملف ${fileOf(p.patientId)} | ${money(p.amount)} ← ${v==='stay'?'الإقامة':'التحاليل والبنود'}`);if(await commit(false,tok)){closeModal();go('file',p.patientId)}},'تحديد نوع الدفعة')}
function delPatient(pid){const P=pat(pid),r=prompt(`حذف ملف «${P.name}» (${P.fileNo}) بالكامل؟\nكل البنود والدفعات والأمانات بتاعته هتتلغي والملف هيختفي من القوائم.\nاكتب سبب الحذف:`);if(!r)return;
 needApproval(async(appr,tok)=>{const by=ME.role==='admin'?ME.name:ME.name+' بموافقة '+appr,at=nowISO(),V={void:true,voidReason:'حذف الملف: '+r,voidBy:by,voidAt:at};let n=0;
  DB.charges.filter(c=>c.patientId===pid&&!c.void).forEach(c=>{Object.assign(c,V);mark('charges',c,'up');n++});
  DB.wallet.filter(w=>w.patientId===pid&&!w.void).forEach(w=>{Object.assign(w,V);mark('charges',w,'up');n++});
  DB.payments.filter(p=>p.patientId===pid&&!p.void).forEach(p=>{Object.assign(p,V);mark('payments',p,'up');n++});
  Object.assign(P,{deleted:true,deletedAt:at,deletedBy:by,deleteReason:r});mark('patients',P,'up');
  log('حذف حالة',`ملف ${P.fileNo} ${P.name} | اتلغى ${n} حركة | السبب: ${r}`);if(await commit(false,tok)){closeModal&&closeModal();go('patients')}},'حذف حالة')}
function voidPay(id){const p=DB.payments.find(x=>x.id===id),r=prompt('سبب إلغاء الدفعة '+p.receiptNo+':');if(!r)return;needApproval(async(appr,tok)=>{Object.assign(p,{void:true,voidReason:r,voidBy:ME.role==='admin'?ME.name:ME.name+' بموافقة '+appr,voidAt:nowISO()});mark('payments',p,'up');log('إلغاء دفعة',`إيصال ${p.receiptNo} | ملف ${fileOf(p.patientId)} | ${money(p.amount)} | السبب: ${r}`);if(await commit(false,tok))go('file',p.patientId)},'إلغاء دفعة')}
function mEditCharge(id){const c=DB.charges.find(x=>x.id===id),s=isStay(c),d=c.days>0?c.days:(c.qty||1);
 modal(`<h2>✏️ تعديل — ${esc(c.service)}</h2><div class="grid">${s?`<div><label>عدد الأيام *</label><input id="ecD" type="number" min="1" step="1" value="${d}" style="font-size:22px;text-align:center" oninput="ecCalc()"></div><div><label>سعر اليوم *</label><input id="ecR" type="number" min="0" step="0.01" value="${c.pkg?'':c.unit}" style="font-size:22px;text-align:center" oninput="$('#ecT').value='';ecCalc()"></div><div><label>أو المبلغ الإجمالي (باقة)</label><input id="ecT" type="number" min="0" step="0.01" value="${c.pkg?c.fee:''}" oninput="$('#ecR').value='';ecCalc()"></div>`:`<div><label>السعر *</label><input id="ecR" type="number" min="0" step="0.01" value="${c.unit}" oninput="ecCalc()"></div><div><label>الكمية</label><input id="ecD" type="number" min="1" step="1" value="${c.qty||1}" oninput="ecCalc()"></div>`}
 <div style="grid-column:1/-1"><label>سبب التعديل *</label><input id="ecW" placeholder="مثال: الأيام 10 مش 11 / السعر المتفق عليه 850"></div></div><div class="summary" id="ecS"></div>
 <p class="hint">التعديل بيتسجل في سجل العمليات (القيمة القديمة والجديدة). الدفعات مش بتتأثر.</p><div class="row" style="margin-top:12px"><button class="btn ok" onclick="saveEditCharge('${id}')">✓ حفظ التعديل</button><button class="btn sec" onclick="closeModal()">إلغاء</button></div>`);ecCalc()}
function ecVals(){const d=Math.round(val('ecD'))||1,t=$('#ecT')?r2(val('ecT')):0,r=r2(val('ecR'));if(t>0)return{d,fee:t,unit:r2(t/d),pkg:true};return{d,fee:r2(d*r),unit:r,pkg:false}}
function ecCalc(){const v=ecVals();$('#ecS').innerHTML=v.fee>0?`<span>${v.pkg?`باقة ${v.d} يوم = <b>${money(v.fee)}</b> (اليوم ${money(v.unit)})`:`${v.d} × ${money(v.unit)} = <b>${money(v.fee)}</b>`}</span>`:''}
function saveEditCharge(id){const c=DB.charges.find(x=>x.id===id),s=isStay(c),v=ecVals(),w=$('#ecW').value.trim();if(!(v.fee>0))return alert('اكتب السعر');if(!w)return alert('اكتب سبب التعديل');
 const old=`${itemName(c)} = ${money(c.net)}`;needApproval(async(appr,tok)=>{c.qty=v.d;c.unit=v.unit;c.fee=v.fee;c.discAmt=Math.min(c.discAmt||0,v.fee);c.net=r2(v.fee-c.discAmt);if(s){c.stay=true;c.days=v.d;if(v.pkg)c.pkg=v.fee;else delete c.pkg}c.editedAt=nowISO();c.editedBy=ME.name;
  mark('charges',c,'up');log('تعديل بند',`ملف ${fileOf(c.patientId)} | ${old} ← ${itemName(c)} = ${money(c.net)} | السبب: ${w}`);if(await commit(false,tok)){closeModal();go('file',c.patientId)}},'تعديل بند')}
function voidCharge(id){const c=DB.charges.find(x=>x.id===id),r=prompt('سبب إلغاء الخدمة "'+c.service+'":');if(!r)return;needApproval(async(appr,tok)=>{Object.assign(c,{void:true,voidReason:r,voidBy:ME.role==='admin'?ME.name:ME.name+' بموافقة '+appr,voidAt:nowISO()});mark('charges',c,'up');log('إلغاء زيارة / خدمة',`ملف ${fileOf(c.patientId)} | ${c.service} | ${money(c.net)} | السبب: ${r}`);if(await commit(false,tok))go('file',c.patientId)},'إلغاء خدمة')}

/* ===== واتساب ===== */
function waNum(s){let d=String(s||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0')&&d.length===11)d='20'+d.slice(1);else if(d.length===10&&d.startsWith('1'))d='20'+d;return d.length>=11?d:''}
function docLines(P){return`الطبيب المعالج: ${docName(P.followId)}`+(supLine(P)?`\nالطبيب المشرف: ${supLine(P)}`:'')}
function receiptText(id){const p=DB.payments.find(x=>x.id===id),P=pat(p.patientId),b=bal(P.id,p.at),S=DB.settings;
 return`*${S.center}*\nإيصال رقم: ${p.receiptNo}\nالتاريخ: ${fdt(p.at)}\n\nالمريض: ${P.name} (ملف ${P.fileNo})${stayText(P)}\n${docLines(P)}${itemsText(P.id,p.at)}\n\nالمبلغ المدفوع: *${money(p.amount)}*\nطريقة الدفع: ${p.method}${p.txn?' — مرجع '+p.txn:''}${p.note?'\nملاحظة: '+p.note:''}\n\nإجمالي المطلوب: ${money(b.fee)}\nالخصومات: ${money(b.disc)}\nإجمالي المدفوع: ${money(b.paid)}\n*المتبقي: ${money(b.rem)}*\n\nللاستفسار: ${S.phones}${S.email?'\n'+S.email:''}`}
function stmtText(pid){const P=pat(pid),b=bal(pid),S=DB.settings,last=DB.payments.filter(p=>p.patientId===pid&&!p.void).sort((a,c)=>c.at.localeCompare(a.at)).slice(0,5);
 return`*${S.center}*\nكشف حساب بتاريخ ${fdt(nowISO())}\n\nالمريض: ${P.name} (ملف ${P.fileNo})${stayText(P)}\n${docLines(P)}${itemsText(pid)}\n\nإجمالي المطلوب: ${money(b.fee)}\nالخصومات: ${money(b.disc)}\nإجمالي المدفوع: ${money(b.paid)}\n*المتبقي: ${money(b.rem)}*`+(last.length?`\n\nآخر الدفعات:\n`+last.map(p=>`• ${fdt(p.at)} — ${money(p.amount)} (${p.method})`).join('\n'):'')+`\n\nللاستفسار: ${S.phones}${S.email?'\n'+S.email:''}`}
function mWA(kind,id){const P=kind==='pay'?pat(DB.payments.find(x=>x.id===id).patientId):pat(id);const text=kind==='pay'?receiptText(id):stmtText(id);
 const opts=[[P.phone,'المريض'],[P.phone2,'هاتف آخر للمريض'],[P.emPhone,'قريب الطوارئ'+(P.emName?' — '+P.emName:'')]].filter(x=>x[0]);
 modal(`<h2>💬 إرسال عبر واتساب</h2><label>إلى</label><select id="waTo" onchange="$('#waOther').style.display=this.value?'none':''">${opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}: ${esc(o[0])}</option>`).join('')}<option value="">رقم آخر...</option></select><input id="waOther" type="tel" placeholder="اكتب الرقم مثل 01012345678" style="margin-top:8px;display:${opts.length?'none':''}">
 <label style="margin-top:10px">نص الرسالة (تقدر تعدّله)</label><textarea id="waTxt" style="min-height:260px">${esc(text)}</textarea><div class="secret">تأكد من صحة الرقم وإن المريض موافق على إرسال بياناته المالية للشخص ده. الرسالة لا تحتوي أي تفاصيل طبية.</div>
 ${kind==='pay'?`<p class="hint" style="margin:4px 0 8px">لإرسال الإيصال كصورة بالشعار: اضغط «نسخ صورة الإيصال»، بعدها «فتح واتساب»، والصق الصورة في المحادثة بـ Ctrl+V.</p>`:''}<div class="row">${kind==='pay'?`<button class="btn" onclick="receiptImage('${id}')">📷 نسخ صورة الإيصال</button>`:''}<button class="btn wa" onclick="sendWA('${P.id}','${kind==='pay'?esc(DB.payments.find(x=>x.id===id).receiptNo):'كشف حساب'}')">💬 فتح واتساب وإرسال</button><button class="btn sec" onclick="closeModal()">إلغاء</button></div>`)}
function sendWA(pid,what){const raw=$('#waTo').value||$('#waOther').value,n=waNum(raw);if(!n)return alert('رقم غير صالح');window.open('https://wa.me/'+n+'?text='+encodeURIComponent($('#waTxt').value),'_blank');log('إرسال عبر واتساب',`ملف ${fileOf(pid)} | ${what} | إلى ${n}`);commit(true);closeModal()}

/* ===== بنود الفاتورة ===== */
function itemsOf(pid,until){return DB.charges.filter(c=>c.patientId===pid&&!c.void&&(!until||c.at<=until)).sort((a,b)=>a.at.localeCompare(b.at))}
function itemName(c){if(isStay(c)&&c.days>0)return`${c.service} — ${c.days} يوم${c.pkg?' (باقة)':' × '+money(c.unit)}`;return c.service+((c.qty||1)>1?` × ${c.qty}`:'')}
function supLine(P){return P.supId&&P.supId!==P.followId?docName(P.supId):''}
function itemsHTML(pid,until){const L=itemsOf(pid,until);if(!L.length)return'';
 return`<h3 style="margin:14px 0 6px">تفاصيل البنود</h3><table style="width:100%"><tr><th>#</th><th>التاريخ</th><th>البند</th><th>السعر</th><th>الخصم</th><th>الصافي</th></tr>${L.map((c,i)=>`<tr><td>${i+1}</td><td>${fdt(c.at).slice(0,10)}</td><td>${esc(itemName(c))}${(c.qty||1)>1?`<div style="font-size:12px;color:#666">${money(c.unit)} للوحدة</div>`:''}${c.note?`<div style="font-size:12px;color:#444">ملاحظة: ${esc(c.note)}</div>`:''}</td><td>${money(c.fee)}</td><td>${c.discAmt?money(c.discAmt):'—'}</td><td><b>${money(c.net)}</b></td></tr>`).join('')}</table>`}
function itemsText(pid,until){const L=itemsOf(pid,until);if(!L.length)return'';return'\n\n*تفاصيل البنود:*\n'+L.map((c,i)=>`${i+1}. ${itemName(c)}: ${money(c.fee)}${c.discAmt?` (خصم ${money(c.discAmt)} ← ${money(c.net)})`:''}${c.note?`\n   ملاحظة: ${c.note}`:''}`).join('\n')}

/* ===== صورة الإيصال (رسم مباشر على canvas) ===== */

  x.textAlign='right';x.font=F(20,600);x.fillStyle='#6a7a8c';x.fillText(l,W-70,y+31,260);x.font=F(21,bold?700:400);x.fillStyle=bold?'#1d2a3a':'#333';x.fillText(v,W-340,y+31,W-420);y+=46};
 row('رقم الإيصال',p.receiptNo);row('التاريخ',fdt(p.at));row('اسم المريض',P.name);row('رقم الملف',P.fileNo);row('تاريخ الوصول',fdt(admitOf(P)));if(P.dischargeAt){row('تاريخ الخروج',fdt(P.dischargeAt));row('سبب الخروج',P.dischargeReason+(P.dischargeNote?' — '+P.dischargeNote:''))}
 row('الطبيب المعالج',docName(P.followId));if(supLine(P))row('الطبيب المشرف',supLine(P));
 row('المبلغ المدفوع',money(p.amount),'#e8f5ee',true);row('طريقة الدفع',p.method+(p.txn?' — مرجع '+p.txn:''));

   x.font=F(13);x.fillStyle='#888';x.fillText(fdt(c.at).slice(0,10)+((c.qty||1)>1?' — '+money(c.unit)+' للوحدة':''),W-70,y+40,W-520);

 const o=document.createElement('canvas');o.width=W;o.height=y;const ox=o.getContext('2d');ox.fillStyle='#fff';ox.fillRect(0,0,W,y);ox.drawImage(c,0,0);return o}
async function receiptImage(id){const p=DB.payments.find(x=>x.id===id);busy(true);
 try{const cv=await receiptCanvas(id);const blob=await new Promise(r=>cv.toBlob(r,'image/png'));let ok=false;

  busy(false);alert(ok?'✓ تم نسخ صورة الإيصال.\nافتح محادثة واتساب واضغط Ctrl+V للصق الصورة ثم إرسال.':'✓ تم تنزيل صورة الإيصال في مجلد التنزيلات.\nابعتها في واتساب كمرفق.')}
 catch(e){busy(false);alert('تعذّر إنشاء الصورة: '+errMsg(e))}}

function doPrint(html){$('#printArea').innerHTML=html;document.body.classList.add('printing');setTimeout(()=>window.print(),80)}

function downloadReady(){const c=cfgGet();if(!c)return;const html=SRC.replace(/const CFG=\{[^;\n]*\};/,'const CFG='+JSON.stringify({url:c.url,key:c.key})+';');download('مركز-مسار.html',html,'text/html')}

/* ===== السجل ===== */
function vAudit(){setTimeout(loadAudit,0);return`<div class="card"><h2>🧾 سجل العمليات</h2><p class="hint">كل إضافة أو تعديل أو إلغاء تُسجَّل باسم الموظف والوقت من السيرفر مباشرة، ولا يمكن تعديلها أو حذفها. السجل لا يحتوي أي محتوى طبي.</p><input id="aq" placeholder="بحث بالاسم أو العملية أو رقم الملف..." oninput="$('#alist').innerHTML=aListHTML(this.value)"><div id="alist" class="tw" style="margin-top:10px"><p class="hint">جاري التحميل...</p></div></div>`}
async function loadAudit(){const {data,error}=await sb.from('m_audit').select('*').order('id',{ascending:false}).limit(3000);const el=$('#alist');if(!el)return;if(error){el.innerHTML='<p class="neg">'+esc(errMsg(error))+'</p>';return}AUD=data;el.innerHTML=aListHTML($('#aq')?$('#aq').value:'')}
function aListHTML(q){q=norm(q);const L=AUD.filter(a=>!q||norm(a.by_name+' '+a.action+' '+a.details).includes(q)).slice(0,1500);return L.length?`<table><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th><th>التفاصيل</th></tr>${L.map(a=>`<tr><td style="white-space:nowrap">${fdt(a.at)}</td><td>${esc(a.by_name)}<div class="hint" style="margin:0">${esc(ROLES[a.role]||a.role||'')}</div></td><td>${esc(a.action)}</td><td>${esc(a.details)}</td></tr>`).join('')}</table>`:'<p class="hint">لا توجد نتائج</p>'}

/* ===== النسخ الاحتياطي ===== */
function vBackup(){return`<div class="card"><h2>💾 نسخة احتياطية</h2><p class="hint">البيانات محفوظة أونلاين، والنسخة دي احتياط إضافي على جهازك. آخر نسخة: ${DB.settings.lastBackup?fdt(DB.settings.lastBackup):'لا يوجد'}.</p>
 <label>كلمة سر لتشفير النسخة (موصى بها بشدة — 6 أحرف على الأقل)</label><input id="bkPw" type="password" style="max-width:320px"><p class="hint" style="margin-top:6px">⚠️ لو نسيت كلمة السر لا يمكن فتح النسخة نهائياً.</p><button class="btn" onclick="exportBackup()">⬇️ تنزيل النسخة</button></div>`}
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
async function kdf(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function exportBackup(){const pw=$('#bkPw').value;let out;busy(true);
 try{await loadAll();const {data:aud}=await sb.from('m_audit').select('*').order('id').limit(100000);const all=Object.assign({},DB,{audit:aud||[],exportedAt:nowISO()});
  if(pw){if(pw.length<6)throw new Error('كلمة السر 6 أحرف على الأقل');if(!window.crypto||!crypto.subtle)throw new Error('التشفير غير مدعوم هنا');const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await kdf(pw,salt),new TextEncoder().encode(JSON.stringify(all)));out=JSON.stringify({app:'masar',v:2,enc:true,salt:b64(salt),iv:b64(iv),ct:b64(new Uint8Array(ct))})}
  else{busy(false);if(!confirm('النسخة بدون كلمة سر ستكون مقروءة لأي شخص يحصل على الملف، وفيها بيانات طبية سرية. متابعة؟'))return;busy(true);out=JSON.stringify({app:'masar',v:2,enc:false,data:all})}
  download('masar-backup-'+dayKey(nowISO())+'.json',out,'application/json');DB.settings.lastBackup=nowISO();mark('settings',{id:'main'},'up');log('نسخة احتياطية',pw?'مشفرة':'غير مشفرة');await commit(true);render()}
 catch(e){alert(errMsg(e))}finally{busy(false)}}

applyZoom(getZoom());
boot();
</script>
</body>
</html>
