<style>
:root{--bg:#f3f6fa;--card:#fff;--line:#e3e9f0;--txt:#1d2a3a;--mut:#6a7a8c;--navy:#25408f;--navy2:#e9eefb;--green:#2f8f5b;--green2:#e8f5ee;--red:#c0392b;--redbg:#fdecea;--ambbg:#fff6e5}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--txt);font-size:16px}
.layout{display:flex;min-height:calc(100vh / var(--z,1))}
.zm{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut)}.zm button{min-width:38px}
.side{width:235px;flex-shrink:0;background:#fff;border-left:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:calc(100vh / var(--z,1));overflow-y:auto;display:flex;flex-direction:column;gap:16px;z-index:5}
.logo{font-size:28px;font-weight:700;color:var(--navy);text-align:center;line-height:1.15}.logo img{display:block;width:96px;height:96px;margin:0 auto 6px;border-radius:50%}.logo .em{display:block;font-size:12px;color:var(--mut);font-weight:400;margin-top:4px;direction:ltr}
#pendBar{position:fixed;top:0;left:0;right:0;z-index:90;background:#fff3cd;color:#7a5410;border-bottom:1px solid #f1d39a;padding:8px 14px;font-size:14px;font-weight:600;text-align:center;display:none}.logo b{color:var(--green)}.logo small{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:4px}
#nav{display:flex;flex-direction:column;gap:4px}
#nav button{display:flex;gap:10px;align-items:center;text-align:right;background:none;border:0;padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer;color:var(--txt)}
#nav button:hover{background:#f4f7fb}
#nav button.on{background:var(--navy2);color:var(--navy);font-weight:700}
.who{margin-top:auto;font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.who .nm{color:var(--txt);font-weight:700;font-size:14px}
main{flex:1;padding:22px;width:100%;max-width:1400px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(30,50,80,.04)}
h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:16px 0 8px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #cfd8e3;border-radius:9px;font:inherit;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy2)}
textarea{min-height:60px;resize:vertical}
.btn{background:var(--navy);color:#fff;border:0;padding:9px 16px;border-radius:9px;cursor:pointer;font:inherit;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ok{background:var(--green)}.btn.wa{background:#1fa855}
.btn.sec{background:#fff;color:var(--navy);border:1px solid #b9c6e6}
.btn.red{background:var(--red)}.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{background:#f6f8fc;color:var(--mut);font-weight:600}
tr.click{cursor:pointer}tr.click:hover{background:#f3f6fd}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcfe}
.stat b{display:block;font-size:20px;margin-top:2px}.stat span{font-size:12px;color:var(--mut)}
.neg{color:var(--red)}.pos{color:var(--green)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--navy2);color:var(--navy);font-weight:600}
.hint{font-size:13px;color:var(--mut);margin:-4px 0 10px}
.warn{background:var(--ambbg);border:1px solid #f1d39a;color:#7a5410;padding:9px 12px;border-radius:9px;margin-bottom:14px;font-size:14px}
.secret{background:var(--redbg);border:1px solid #f3c2bc;color:#8a2a20;padding:7px 11px;border-radius:9px;font-size:13px;margin:8px 0}
tr.void td{text-decoration:line-through;color:#a9b3bc}
.summary{display:flex;gap:18px;flex-wrap:wrap;background:var(--green2);border-radius:10px;padding:11px 14px;margin-top:12px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(20,30,50,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 10px;overflow:auto;z-index:50}
#modal2{z-index:60}
.modal .box{background:#fff;border-radius:14px;max-width:800px;width:100%;padding:20px}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#eef2fb,#eaf6ef);padding:16px;overflow:auto}
.lbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;width:100%;max-width:400px;box-shadow:0 8px 30px rgba(30,50,90,.08);margin:auto}
.lbox.wide{max-width:620px}
.lbox input,.lbox select{margin-bottom:10px}
.steps{padding-right:20px;line-height:1.9;font-size:14px}
.medi{border-right:3px solid var(--navy);padding:7px 11px;margin-bottom:8px;background:#f7f9fd;border-radius:8px;white-space:pre-wrap}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:100;display:none;align-items:center;justify-content:center;font-weight:700;color:var(--navy)}
#busy div{background:#fff;border:1px solid var(--line);padding:14px 22px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
#toast{position:fixed;bottom:22px;left:22px;background:var(--green);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;z-index:110;display:none}
#printArea{display:none}
.rc{max-width:720px;margin:auto;color:#000;font-family:Cairo,Tahoma,sans-serif}
.rc table td,.rc table th{border:1px solid #999;padding:6px}
.rc .hd{text-align:center;border-bottom:2px solid #25408f;padding-bottom:8px;margin-bottom:10px}
@media print{body.printing>*:not(#printArea){display:none!important}body.printing #printArea{display:block}body{background:#fff}}
@media(max-width:860px){.logo img{width:40px;height:40px;display:inline-block;vertical-align:middle;margin:0 0 0 6px}.logo .em{display:none}.layout{flex-direction:column}.side{width:auto;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px 10px;border-left:0;border-bottom:1px solid var(--line);gap:8px}.logo{font-size:20px}.logo small{display:none}#nav{flex-direction:row;flex-wrap:wrap}#nav button{padding:7px 9px}.who{margin:0;border:0;padding:0;flex-direction:row;align-items:center}main{padding:12px}}

.mbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.mbar input[type=month]{max-width:200px}
td input.q{max-width:90px;padding:6px 8px}
.paid{color:var(--green);font-weight:700}
.rolechip{font-size:12px;padding:2px 8px;border-radius:20px;background:#f1f4f9;color:#445}
.ecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.ec{background:#fff;border:1px solid #e3e8f0;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ec.done{border-color:#bfe0cc;background:#f6fbf8}
.ec .top{display:flex;justify-content:space-between;align-items:start;gap:8px}
.ec .nm{font-size:19px;font-weight:700}
.ec .calc{background:#f5f7fb;border-radius:10px;padding:8px 12px;font-size:15px}
.ec .lines div{display:flex;justify-content:space-between;font-size:15px;padding:2px 0}
.ec .net{display:flex;justify-content:space-between;align-items:center;border-top:2px dashed #dde3ec;padding-top:10px}
.ec .net b{font-size:24px}
.qb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qb button{border:1px solid #dde3ec;background:#fff;border-radius:10px;padding:10px 2px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.qb button:active{background:#eef2f8}
.ec details summary{cursor:pointer;color:#557;font-size:14px}
.ec details .it{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0;border-bottom:1px solid #f0f2f6;gap:6px}
.bigin{font-size:26px!important;text-align:center;padding:12px!important}
#app.layout{display:block}#app .side{display:none}#app main{padding:0 0 30px;max-width:none}
.hdr{background:linear-gradient(135deg,#0d5a45,#0a3f31);color:#fff;padding:22px 26px 26px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.hdr .brand{display:flex;align-items:center;gap:14px}.hdr .brand img{width:58px;height:58px;border-radius:16px;background:#fff;padding:5px;object-fit:contain}
.hdr h1{margin:0;font-size:28px;line-height:1.25}.hdr .sub{opacity:.85;font-size:14px;margin-top:4px}
.hdr .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:640px}
.hb{border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.hb.w{background:#fff;color:#0d5a45}.hb.r{background:#e2334a;color:#fff}.hb.o{background:#f5a20a;color:#3a2600}.hb.g{background:#14a06f;color:#fff;border:1px solid #2fd39a}
.wrap{max-width:1400px;margin:0 auto;padding:0 18px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid #e6ebf1;border-radius:18px;padding:12px 16px;margin:-14px 0 18px;position:relative;box-shadow:0 6px 20px rgba(20,40,60,.06)}
.topbar .l{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.topbar input[type=month]{width:auto;padding:8px 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid #e6ebf1;border-radius:22px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:150px}
.kpi .t{color:#5b6b7c;font-weight:700;font-size:15px}.kpi .v{font-size:32px;font-weight:800;margin:8px 0 4px;color:#14202e}.kpi .s{font-size:13px;color:#7a8898}
.kpi .ic{width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.kpi.dark{background:linear-gradient(135deg,#0d5a45,#0a3f31);color:#fff;border:0}.kpi.dark .t,.kpi.dark .s{color:#bfe8d8}.kpi.dark .v{color:#fff}
.kpi .two{display:flex;gap:12px;align-items:center;margin:8px 0 4px}.kpi .two b{font-size:20px}
.filters{background:#fff;border:1px solid #e6ebf1;border-radius:20px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:0;background:#f1f4f8;color:#334;border-radius:12px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}.chip.on{background:#0d5a45;color:#fff}
.filters .r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.offl{display:inline-flex!important;align-items:center;gap:6px;margin:0!important;white-space:nowrap;width:auto!important;min-width:0!important}.offl input{width:18px!important;min-width:0!important;height:18px;margin:0}.filters select,.filters input{width:auto;min-width:200px;border-radius:12px}
.ptab{background:#fff;border:1px solid #e6ebf1;border-radius:22px;overflow:hidden}
.ptab .cap{padding:14px 18px;font-weight:700;color:#334;border-bottom:1px solid #eef1f5}
.ptab .sc{overflow-x:auto}.ptab table{width:100%;min-width:1150px;border-collapse:collapse}
.ptab th{background:#f7f9fb;color:#5b6b7c;font-size:14px;padding:14px 12px;text-align:right;white-space:nowrap}
.ptab td{padding:16px 12px;border-top:1px solid #eef1f5;vertical-align:middle;font-size:15px}

.ptab .nm{font-weight:800;font-size:17px;cursor:pointer;min-width:170px}.ptab table{min-width:1250px}.ab{flex-wrap:wrap;max-width:210px;margin-right:auto}.ptab .ds{color:#8a96a4;font-size:13px;margin-top:3px;max-width:200px}
.bdg{display:inline-flex;align-items:center;gap:5px;border-radius:10px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.d-doc{background:#f3e8ff;color:#7a2fc0}.d-psy{background:#dff7ea;color:#14804f}.d-nur{background:#e3effd;color:#2559b8}.d-sup{background:#fff1dc;color:#a65b00}.d-wrk{background:#eef1f5;color:#4a5765}
.s-ses{background:#f5ecff;color:#7a2fc0;border:1px solid #e6d3fb}.s-mon{background:#f1f4f8;color:#3c4a59}.s-day{background:#e7f6ff;color:#1b6aa0}.s-hr{background:#fff4e0;color:#9a5b00}
.stp{display:inline-flex;align-items:center;border:1px solid #e3d7f7;border-radius:14px;overflow:hidden;background:#fbf8ff}
.stp button{width:36px;height:36px;border:0;font-size:20px;font-weight:800;cursor:pointer;background:transparent;color:#7a2fc0}
.stp button.p{background:#7a2fc0;color:#fff;border-radius:10px;margin:3px}.stp button:disabled{opacity:.3;cursor:default}
.stp b{min-width:44px;text-align:center;font-size:17px}.stp.mute{border-color:#e3e8ef;background:#f7f9fb}.stp.mute button{color:#5b6b7c}.stp.mute button.p{background:#5b6b7c;color:#fff}
.stl{font-size:12px;color:#8a96a4;margin-top:4px;text-align:center}
.cl{cursor:pointer;border-radius:8px;padding:4px 8px;display:inline-block}.cl:hover{background:#f1f4f8}
.ab{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.ib{width:38px;height:38px;border-radius:12px;border:0;background:#f1f4f8;cursor:pointer;font-size:16px}
.rb{border:1px solid #f3d27a;background:#fff8e6;color:#8a5a00;border-radius:12px;padding:7px 12px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.pb{border:0;background:#14a06f;color:#fff;border-radius:12px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.tot td{background:#f7f9fb;font-weight:800}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.hdr h1{font-size:22px}}
@media(max-width:560px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:14px;border-radius:16px}.kpi .ic{display:none}.kpi .v{font-size:21px}.kpi .t{font-size:13px}.kpi .two b{font-size:14px}.hdr{padding:16px}.hb{padding:10px 12px;font-size:13px}.filters select,.filters input{min-width:0;width:100%}.kpi{min-height:0}}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const money=n=>r2(n).toLocaleString('en-US',{maximumFractionDigits:2})+' '+SET.cur;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const nowISO=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,'0');
const dayKey=iso=>{const d=new Date(iso);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const monthOf=k=>String(k).slice(0,7);
const curMonth=()=>dayKey(nowISO()).slice(0,7);
const fdt=iso=>{if(!iso)return'';const d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const fday=k=>{const p=String(k).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:k};

const MEM={};const Store={getItem:k=>{try{return localStorage.getItem(k)}catch(e){return MEM[k]??null}},setItem:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){MEM[k]=v}},removeItem:k=>{try{localStorage.removeItem(k)}catch(e){delete MEM[k]}}};

const act=k=>FIN.filter(x=>x.kind===k&&!x.void);
const emps=(all)=>FIN.filter(x=>x.kind==='emp'&&(all||x.active!==false)).sort((a,b)=>JOBS.indexOf(a.job)-JOBS.indexOf(b.job)||a.name.localeCompare(b.name,'ar'));
const emp=id=>FIN.find(x=>x.kind==='emp'&&x.id===id);
const slipOf=(eid,m)=>act('pslip').find(s=>s.empId===eid&&s.month===m);
const isAuto=e=>(e.ptype==='daily'||e.ptype==='shift')&&e.att!=='manual';
const unitOf=e=>isAuto(e)?'أيام غياب':PT[e.ptype].u;
const ptLabel=e=>PT[e.ptype].l+(isAuto(e)?' — تلقائي':'');
function lastDayOf(m){const[y,mm]=m.split('-').map(Number);return m+'-'+pad(new Date(y,mm,0).getDate())}
function periodsOf(e){if(Array.isArray(e.periods)&&e.periods.length)return e.periods.filter(p=>p&&p.from).slice().sort((a,b)=>a.from.localeCompare(b.from));return[{from:e.ptype==='monthly'?'2000-01-01':(e.start||dayKey(e.createdAt||nowISO())),to:e.end||''}]}
function activeNow(e){const t=dayKey(nowISO());return periodsOf(e).some(p=>p.from<=t&&(!p.to||p.to>=t))}
function daysIn(e,m,capToday){const ms=m+'-01',me=lastDayOf(m),today=dayKey(nowISO());let days=0;const segs=[];
 for(const p of periodsOf(e)){let a=p.from>ms?p.from:ms,b=me;if(capToday&&today<b)b=today;if(p.to&&p.to<b)b=p.to;if(a>b)continue;const d=Math.round((Date.parse(b)-Date.parse(a))/864e5)+1;days+=d;segs.push({from:a,to:b,days:d})}
 return{days,segs,from:segs.length?segs[0].from:ms,to:segs.length?segs[segs.length-1].to:ms}}
function autoSpan(e,m){return daysIn(e,m,true)}
const monthDays=m=>+lastDayOf(m).slice(8);
const segTxt=segs=>segs.map(g=>`من ${fday(g.from).slice(0,5)} لـ ${fday(g.to).slice(0,5)}`).join(' ، ');
function calc(e,m){const W=act('pwork').filter(w=>w.empId===e.id&&monthOf(w.date)===m);let qty=r2(W.reduce((s,w)=>s+(+w.qty||0),0)),auto=null;
 let gross,mon=null;if(e.ptype==='monthly'){const md=daysIn(e,m,false),full=md.days>=monthDays(m),base=full?e.rate:r2(Math.min(e.rate,e.rate/30*md.days));mon={days:md.days,full,segs:md.segs,base};gross=r2(Math.max(0,base-(e.rate/30)*qty))}
 else if(isAuto(e)){const sp=autoSpan(e,m),per=e.ptype==='shift'?(+e.spd||1):1,worked=Math.max(0,sp.days-qty);auto=Object.assign(sp,{absent:qty,worked,per,units:r2(worked*per)});gross=r2(e.rate*auto.units)}
 else gross=r2(e.rate*qty);
 const A=act('padj').filter(a=>a.empId===e.id&&monthOf(a.date)===m),bon=A.filter(a=>a.type==='bonus'),ded=A.filter(a=>a.type==='deduct'),V=act('padv').filter(a=>a.empId===e.id&&monthOf(a.date)===m);
 const bonT=r2(bon.reduce((s,a)=>s+a.amount,0)),dedT=r2(ded.reduce((s,a)=>s+a.amount,0)),advT=r2(V.reduce((s,a)=>s+a.amount,0));
 const slip=slipOf(e.id,m),o={W,qty,gross,auto,mon,bon,ded,V,bonT,dedT,advT,net:r2(gross+bonT-dedT-advT),slip};
 if(slip)Object.assign(o,{qty:slip.qty,gross:slip.gross,bonT:slip.bonT,dedT:slip.dedT,advT:slip.advT,net:slip.net,auto:slip.auto||null,mon:slip.mon||mon});return o}
function qtyHTML(e,c){if(c.auto)return`<b>${c.auto.units} ${e.ptype==='shift'?'شيفت':'يوم'}</b><div class="hint" style="margin:2px 0 0">من ${fday(c.auto.from)} لـ ${fday(c.auto.to)}${c.auto.absent?` — غياب ${c.auto.absent}`:''}</div>`;return`${c.qty} ${PT[e.ptype].u}`}
async function save(objs,audit,quiet){if(!quiet)busy(true);try{const {error}=await sb.rpc('m_save',{p_batch:uid(),p_rows:objs.map(o=>({t:'fin',k:'up',id:o.id,data:o})),p_audit:audit.map(a=>({cid:uid(),action:a[0],details:a[1]})),p_approval:null});if(error)throw error;
  for(const o of objs){const i=FIN.findIndex(x=>x.id===o.id);if(i<0)FIN.push(o);else FIN[i]=o}if(!quiet)toast('تم الحفظ ✓');return true}
 catch(e){alert('⚠️ لم يتم الحفظ: '+errMsg(e));return false}finally{if(!quiet)busy(false)}}
async function loadAll(){const [f,s]=await Promise.all([sb.rpc('m_fin_list',{p_token:null}),sb.from('m_settings').select('data').eq('id','main').maybeSingle()]);if(f.error)throw f.error;
 let d=f.data;if(typeof d==='string'){try{d=JSON.parse(d)}catch(e){d=[]}}if(d&&!Array.isArray(d))d=[d];FIN=(d||[]).map(x=>x&&x.m_fin_list!==undefined?x.m_fin_list:x).flat().filter(x=>x&&x.id);
 if(s.data&&s.data.data)Object.assign(SET,s.data.data)}
function locked(eid,dateKey){const s=slipOf(eid,monthOf(dateKey));if(s){alert(`راتب ${emp(eid).name} لشهر ${mName(monthOf(dateKey))} اتصرف خلاص.\nلو عايز تعدّل، الغي الصرف الأول من كشف الشهر.`);return true}return false}

function waNum(s){let d=String(s||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0')&&d.length===11)d='20'+d.slice(1);else if(d.length===10&&d.startsWith('1'))d='20'+d;return d.length>=11?d:''}
function slipText(e){const c=calc(e,MONTH),s=c.slip,rate=s?s.rate:e.rate,u=UNITS[e.ptype];

 return`<div class="card"><h2>💵 تسجيل سلفة</h2><p class="hint">السلفة بتتخصم من صافي راتب نفس الشهر، وبتنزل في مصروفات البرنامج الرئيسي وقت ما تتسجل (لأن الفلوس خرجت من الخزنة).</p><div class="grid">
 <div><label>الموظف *</label><select id="aE"><option value="">— اختر —</option>${empOpts('')}</select></div><div><label>التاريخ</label><input type="date" id="aD" value="${dayKey(nowISO())}"></div><div><label>المبلغ (${esc(SET.cur)}) *</label><input type="number" id="aA" min="0" step="0.01"></div><div><label>ملاحظة</label><input id="aN"></div></div>
 <button class="btn ok" style="margin-top:12px" onclick="saveAdv()">✓ حفظ السلفة</button></div>
 <div class="card"><h2>سلف ${mName(MONTH)} <span class="tag">${money(T)}</span></h2><div class="tw">${L.length?`<table><tr><th>التاريخ</th><th>الموظف</th><th>المبلغ</th><th>ملاحظة</th><th></th></tr>${L.map(a=>`<tr><td>${fday(a.date)}</td><td>${esc((emp(a.empId)||{}).name)}</td><td><b>${money(a.amount)}</b></td><td>${esc(a.note)}</td><td><button class="btn red sm" onclick="voidRec('${a.id}')">حذف</button></td></tr>`).join('')}</table>`:'<p class="hint">لا يوجد</p>'}</div></div>`}
function mAdvAll(){const L=act('padv').filter(a=>monthOf(a.date)===MONTH).sort((a,b)=>b.date.localeCompare(a.date)),T=r2(L.reduce((s,a)=>s+a.amount,0));
 modal(`<h2>💵 سلفة</h2><p class="hint">السلفة بتتخصم من صافي راتب نفس الشهر، وبتنزل في مصروفات البرنامج الرئيسي (فلوس خرجت من الخزنة).</p><div class="grid">
 <div><label>الموظف *</label><select id="aE"><option value="">— اختر —</option>${empOpts('')}</select></div><div><label>المبلغ (${esc(SET.cur)}) *</label><input type="number" id="aA" class="bigin" inputmode="decimal" min="0" step="0.01"></div><div><label>التاريخ</label><input type="date" id="aD" value="${dayKey(nowISO())}"></div><div><label>ملاحظة</label><input id="aN"></div></div>
 <div class="row" style="margin-top:12px"><button class="btn ok" style="flex:1" onclick="saveAdv()">✓ حفظ السلفة</button><button class="btn sec" onclick="closeModal()">إغلاق</button></div>
 <h3 style="margin-top:16px">سلف ${mName(MONTH)} <span class="tag">${money(T)}</span></h3><div class="tw">${L.length?`<table><tr><th>التاريخ</th><th>الموظف</th><th>المبلغ</th><th>ملاحظة</th><th></th></tr>${L.map(a=>`<tr><td>${fday(a.date)}</td><td>${esc((emp(a.empId)||{}).name)}</td><td><b>${money(a.amount)}</b></td><td>${esc(a.note)}</td><td><button class="btn red sm" onclick="voidRec('${a.id}').then(()=>mAdvAll())">حذف</button></td></tr>`).join('')}</table>`:'<p class="hint">لسه مفيش سلف الشهر ده</p>'}</div>`)}
async function saveAdv(){const eid=$('#aE').value,d=$('#aD').value,a=r2($('#aA').value);if(!eid||!d||a<=0)return alert('اختار الموظف واكتب المبلغ');if(locked(eid,d))return;const e=emp(eid),id=uid(),at=new Date(d+'T12:00:00').toISOString();
 const ex={id:'exp_'+id,kind:'exp',partner:'',at,cat:'رواتب',desc:`سلفة — ${e.name} (${e.job})`,amount:a,paidBy:ME.name,note:'من برنامج الرواتب',by:ME.name,createdAt:nowISO(),void:false,src:'payroll'};
 if(await save([{id,kind:'padv',empId:eid,date:d,amount:a,note:$('#aN').value.trim(),expId:ex.id,by:ME.name,createdAt:nowISO(),void:false},ex],[['سلفة',`${e.name} | ${fday(d)} | ${money(a)}`]])){if(typeof closeModal==='function')closeModal();render()}}

/* ===== مكافآت وخصومات ===== */
function vAdj(){const L=act('padj').filter(a=>monthOf(a.date)===MONTH).sort((a,b)=>b.date.localeCompare(a.date));
 return`<div class="card"><h2>⚖️ مكافأة أو خصم</h2><div class="grid">
 <div><label>الموظف *</label><select id="jE"><option value="">— اختر —</option>${empOpts('')}</select></div><div><label>النوع</label><select id="jT"><option value="bonus">مكافأة / إضافي (+)</option><option value="deduct">خصم / جزاء (−)</option></select></div>
 <div><label>التاريخ</label><input type="date" id="jD" value="${dayKey(nowISO())}"></div><div><label>المبلغ (${esc(SET.cur)}) *</label><input type="number" id="jA" min="0" step="0.01"></div><div><label>السبب *</label><input id="jR"></div></div>
 <button class="btn ok" style="margin-top:12px" onclick="saveAdj()">✓ حفظ</button></div>
 <div class="card"><h2>مكافآت وخصومات ${mName(MONTH)}</h2><div class="tw">${L.length?`<table><tr><th>التاريخ</th><th>الموظف</th><th>النوع</th><th>المبلغ</th><th>السبب</th><th></th></tr>${L.map(a=>`<tr><td>${fday(a.date)}</td><td>${esc((emp(a.empId)||{}).name)}</td><td>${a.type==='bonus'?'<span class="pos">مكافأة</span>':'<span class="neg">خصم</span>'}</td><td><b>${money(a.amount)}</b></td><td>${esc(a.reason)}</td><td><button class="btn red sm" onclick="voidRec('${a.id}')">حذف</button></td></tr>`).join('')}</table>`:'<p class="hint">لا يوجد</p>'}</div></div>`}
async function saveAdj(){const eid=$('#jE').value,d=$('#jD').value,a=r2($('#jA').value),r=$('#jR').value.trim(),t=$('#jT').value;if(!eid||!d||a<=0||!r)return alert('اختار الموظف واكتب المبلغ والسبب');if(locked(eid,d))return;const e=emp(eid);
 if(await save([{id:uid(),kind:'padj',empId:eid,date:d,type:t,amount:a,reason:r,by:ME.name,createdAt:nowISO(),void:false}],[[t==='bonus'?'مكافأة':'خصم',`${e.name} | ${fday(d)} | ${money(a)} | ${r}`]]))render()}

/* ===== الموظفين ===== */
function vEmps(){const E=emps(true);return`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">👥 الموظفين</h2><button class="btn ok" onclick="mEmp()">+ إضافة موظف</button></div>
 <div class="tw" style="margin-top:10px">${E.length?`<table><tr><th>الاسم</th><th>الوظيفة</th><th>طريقة الحساب</th><th>السعر</th><th>الهاتف</th><th>الحالة</th><th></th></tr>${E.map(e=>`<tr class="${e.active===false?'void':''}"><td><b>${esc(e.name)}</b></td><td>${esc(e.job)}</td><td>${ptLabel(e)}${isAuto(e)?`<div class="hint" style="margin:0">من ${fday(e.start||dayKey(e.createdAt||nowISO()))}${e.end?' لـ '+fday(e.end):''}</div>`:''}</td><td>${money(e.rate)}</td><td>${esc(e.phone)}</td><td>${e.active===false?'موقوف':'شغال'}</td><td><div class="row"><button class="btn sec sm" onclick="mEmp('${e.id}')">تعديل</button><button class="btn sec sm" onclick="togEmp('${e.id}')">${e.active===false?'تفعيل':'إيقاف'}</button></div></td></tr>`).join('')}</table>`:'<p class="hint">لا يوجد موظفين.</p>'}</div>
 <p class="hint" style="margin-top:8px">تغيير السعر بيسري على الشهور اللي لسه ما اتصرفتش. الشهور اللي اتصرفت محفوظة بالسعر وقت الصرف.</p></div>`}
function mEmp(id){const e=id?emp(id):{name:'',job:JOBS[0],ptype:'monthly',rate:'',phone:'',start:'',end:'',note:''};const ds=(e.ptype==='daily'||e.ptype==='shift')?'':'none';modal(`<h2>${id?'تعديل موظف':'إضافة موظف'}</h2><div class="grid">
 <div><label>الاسم *</label><input id="eN" value="${esc(e.name)}"></div><div><label>الوظيفة *</label><select id="eJ">${JOBS.map(j=>`<option ${j===e.job?'selected':''}>${j}</option>`).join('')}</select></div>
 <div><label>طريقة الحساب *</label><select id="eT" onchange="$('#eRL').textContent=PT[this.value].r+' *';const d=this.value==='daily'||this.value==='shift';$('#eSPW').style.display=this.value==='shift'?'':'none'">${Object.entries(PT).map(([k,v])=>`<option value="${k}" ${k===e.ptype?'selected':''}>${v.l}</option>`).join('')}</select></div>
 <div><label id="eRL">${PT[e.ptype].r} *</label><input id="eR" type="number" min="0" step="0.01" value="${esc(e.rate)}"></div>
 <div><label>الهاتف (واتساب)</label><input id="eP" type="tel" value="${esc(e.phone)}"></div><div><label>تاريخ بداية الشغل *</label><input id="eS" type="date" value="${esc(id&&e.periods?periodsOf(e)[0].from:(e.start||''))}"></div>
 <div id="eAW" style="display:none"><label>طريقة الحضور</label><select id="eA"><option value="auto" ${e.att!=='manual'?'selected':''}>تلقائي — حاضر كل يوم من تاريخ البداية (تسجّل الغياب بس)</option><option value="manual" ${e.att==='manual'?'selected':''}>يدوي — أسجّل كل يوم/شيفت بنفسي</option></select></div>
 <div id="eSPW" style="display:${e.ptype==='shift'?'':'none'}"><label>عدد الشيفتات في اليوم</label><input id="eSP" type="number" min="0.5" step="0.5" value="${esc(e.spd||1)}"></div>
 <div style="display:${e.end?'':'none'}"><label>آخر يوم شغل</label><input id="eE" type="date" value="${esc(e.end||'')}"></div></div>
 <div style="margin-top:10px"><label>الوصف / التخصص (اختياري)</label><input id="eO" value="${esc(e.note)}" placeholder="مثال: استشاري طب نفسي - جلسات فردية"></div><p class="hint" style="margin-top:8px">الراتب بيتحسب من تاريخ البداية. لو الموظف وقف ورجع، استخدم زرار <b>⏯ فترات الشغل</b> في الجدول.</p><div class="row" style="margin-top:14px"><button class="btn ok" onclick="saveEmp('${id||''}')">✓ حفظ</button><button class="btn sec" onclick="closeModal()">إلغاء</button>${id?`<button class="btn red" onclick="closeModal();togEmp('${id}')">${e.active===false?'تفعيل':'⛔ إيقاف (ساب الشغل)'}</button>`:''}</div>`)}
async function saveEmp(id){const n=$('#eN').value.trim(),r=r2($('#eR').value);if(!n||r<=0)return alert('اكتب الاسم والسعر');if(!id&&!$('#eS').value)return alert('اختار تاريخ بداية الشغل — الراتب بيتحسب من التاريخ ده');const old=id?emp(id):null;
 const o=Object.assign({},old||{id:'emp_'+uid(),kind:'emp',active:true,createdAt:nowISO()},{name:n,job:$('#eJ').value,ptype:$('#eT').value,rate:r,phone:$('#eP').value.trim(),att:$('#eA').value,spd:r2($('#eSP').value)||1,note:$('#eO').value.trim()});
 {const sv=$('#eS').value;if(!old||old.periods||(sv&&sv!==(old.start||''))){const L=old?periodsOf(Object.assign({},old,{ptype:old.periods?old.ptype:'x'})).map(p=>({from:p.from,to:p.to||''})):[{from:sv||dayKey(nowISO()),to:''}];if(sv&&(!L[1]||sv<L[1].from)&&(!L[0].to||sv<=L[0].to))L[0].from=sv;o.periods=L;o.start=L[0].from;o.end=L[L.length-1].to||''}else o.start=sv}
 if(await save([o],[[id?'تعديل موظف':'إضافة موظف',`${n} | ${o.job} | ${PT[o.ptype].l} | ${money(r)}`]])){closeModal();render()}}
async function togEmp(id){const e=emp(id),o=Object.assign({},e,{active:e.active===false}),t=dayKey(nowISO()),L=periodsOf(e).map(p=>({from:p.from,to:p.to||''}));
 if(!o.active&&!L[L.length-1].to)L[L.length-1].to=t;if(o.active&&L[L.length-1].to&&L[L.length-1].to<t&&confirm('تبدأله فترة شغل جديدة من النهارده؟'))L.push({from:t,to:''});o.periods=L;o.start=L[0].from;o.end=L[L.length-1].to||'';if(await save([o],[[o.active?'تفعيل موظف':'إيقاف موظف',e.name]]))render()}

/* ===== الطباعة ===== */
function doPrint(html){$('#printArea').innerHTML=html;document.body.classList.add('printing');setTimeout(()=>window.print(),80)}
addEventListener('afterprint',()=>document.body.classList.remove('printing'));
function head(t){return`<div class="hd"><img src="${LOGO}" style="width:90px;height:90px;display:block;margin:0 auto 4px"><h2 style="margin:0;color:#25408f">${esc(SET.center)}</h2>${SET.phones?`<div>${esc(SET.phones)}</div>`:''}<h3 style="margin:8px 0 0">${t}</h3></div>`}
function printSlip(eid){const e=emp(eid),c=calc(e,MONTH),s=c.slip,v=s||c;
 const list=(arr,f)=>arr.length?arr.map(f).join('<br>'):'—';
 doPrint(`<div class="rc">${head('قسيمة راتب — '+mName(MONTH))}<table style="width:100%"><tr><th>الموظف</th><td>${esc(e.name)}</td><th>الوظيفة</th><td>${esc(e.job)}</td></tr><tr><th>طريقة الحساب</th><td>${ptLabel(e)}</td><th>${PT[e.ptype].r}</th><td>${money(s?s.rate:e.rate)}</td></tr><tr><th>${e.ptype==='monthly'?'أيام الغياب':'الكمية'}</th><td>${qtyHTML(e,c)}</td><th>الأساسي المستحق</th><td>${money(v.gross)}</td></tr></table><br>
 <table style="width:100%"><tr><th>المكافآت</th><td>${list(c.bon,a=>`${fday(a.date)} — ${esc(a.reason)}: ${money(a.amount)}`)}</td><td><b>${money(v.bonT)}</b></td></tr><tr><th>الخصومات</th><td>${list(c.ded,a=>`${fday(a.date)} — ${esc(a.reason)}: ${money(a.amount)}`)}</td><td><b>${money(v.dedT)}</b></td></tr><tr><th>السلف</th><td>${list(c.V,a=>`${fday(a.date)}: ${money(a.amount)}`)}</td><td><b>${money(v.advT)}</b></td></tr><tr><th colspan="2" style="font-size:18px">الصافي</th><td style="font-size:18px"><b>${money(v.net)}</b></td></tr></table>
 <p style="margin-top:20px">${s?`تم الصرف بتاريخ ${fdt(s.paidAt)} — بواسطة ${esc(s.by)}`:'⚠️ لم يتم الصرف بعد'}</p><p style="margin-top:24px">توقيع الموظف: ....................&emsp;&emsp;توقيع الإدارة: ....................</p></div>`)}
function printSheet(){const R=emps(true).map(e=>({e,c:calc(e,MONTH)})).filter(x=>x.e.active!==false||x.c.qty||x.c.gross||x.c.slip||x.c.bonT||x.c.dedT||x.c.advT);const T=k=>r2(R.reduce((s,x)=>s+x.c[k],0));
 doPrint(`<div class="rc" style="max-width:1000px">${head('كشف رواتب '+mName(MONTH))}<table style="width:100%;font-size:13px"><tr><th>الموظف</th><th>الوظيفة</th><th>الحساب</th><th>الكمية</th><th>الأساسي</th><th>مكافآت</th><th>خصومات</th><th>سلف</th><th>الصافي</th><th>الحالة</th></tr>${R.map(({e,c})=>`<tr><td>${esc(e.name)}</td><td>${esc(e.job)}</td><td>${ptLabel(e)} — ${money(c.slip?c.slip.rate:e.rate)}</td><td>${qtyHTML(e,c)}</td><td>${money(c.gross)}</td><td>${money(c.bonT)}</td><td>${money(c.dedT)}</td><td>${money(c.advT)}</td><td><b>${money(c.net)}</b></td><td>${c.slip?'اتصرف '+fdt(c.slip.paidAt):'لم يُصرف'}</td></tr>`).join('')}<tr><th colspan="4">الإجمالي</th><th>${money(T('gross'))}</th><th>${money(T('bonT'))}</th><th>${money(T('dedT'))}</th><th>${money(T('advT'))}</th><th>${money(T('net'))}</th><th></th></tr></table></div>`)}

boot();
</script>
